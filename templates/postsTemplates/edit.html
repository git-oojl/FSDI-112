{% extends 'base.html' %}

{% block title %}
    Edit Post {{ post.id }}
{% endblock %}

{% block content %}
    <h1>Edit Post #{{ post.id }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Update" class="btn-solid theme-primary">
    </form>
{% endblock %}
